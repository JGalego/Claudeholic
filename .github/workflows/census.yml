name: Tally the census returns

on:
  schedule:
    # Monday, 05:17 UTC. The census office keeps unusual but consistent hours.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: census
  cancel-in-progress: false

jobs:
  tally:
    name: Count the respondents
    runs-on: ubuntu-latest
    steps:
      - name: Check out the case file
        uses: actions/checkout@v4

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aggregate public returns
        run: node scripts/aggregate-census.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the paperwork still passes review
        run: npm test

      - name: Publish the tally
        run: |
          if git diff --quiet -- data/census.json; then
            echo "No new returns. The ledger rests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/census.json
          git commit -m "chore: tallied the census returns"
          git push
